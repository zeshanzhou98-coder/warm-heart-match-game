<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>米粒大王的工作台 - 管理后台</title>
<style>
:root{--pink:#ff85a2;--pink2:#ffb3c6;--pink-light:#fff0f3;--pink-dark:#e84d7a;--mint:#a8e6cf;--mint-dark:#56c596;--text:#4a3728;--text2:#8b7355;--text3:#b8a088;--card:rgba(255,255,255,0.95);--shadow:0 4px 16px rgba(255,133,162,0.12);--radius:16px;--bd:2px solid rgba(255,133,162,0.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#fff5f7;color:var(--text);min-height:100vh}
.app{display:flex;min-height:100vh}

/* Sidebar */
.sidebar{width:220px;background:linear-gradient(180deg,#fffef9,#fff0f5);border-right:var(--bd);padding:20px 12px;display:flex;flex-direction:column;position:fixed;top:0;bottom:0;z-index:100}
.logo{text-align:center;padding:16px 0;border-bottom:var(--bd);margin-bottom:12px}
.logo h1{font-size:18px;color:var(--pink-dark);font-weight:800}
.logo p{font-size:11px;color:var(--text3);margin-top:4px}
.nav{flex:1;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;cursor:pointer;transition:all .2s;font-size:13px;font-weight:600;color:var(--text2);margin-bottom:4px}
.nav-item:hover{background:var(--pink-light);color:var(--pink-dark)}
.nav-item.active{background:linear-gradient(135deg,var(--pink),var(--pink-dark));color:#fff;box-shadow:0 4px 14px rgba(255,133,162,0.35)}
.sidebar-footer{text-align:center;font-size:10px;color:var(--text3);padding:12px 0;border-top:var(--bd)}

/* Main */
.main{flex:1;margin-left:220px;min-height:100vh}
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,0.95);backdrop-filter:blur(10px);border-bottom:var(--bd);padding:12px 24px;display:flex;align-items:center;justify-content:space-between}
.topbar h2{font-size:16px;font-weight:700;color:var(--pink-dark)}
.content{padding:24px}
.page{display:none;animation:fadeIn .3s}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* Cards */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;border:var(--bd);margin-bottom:16px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.card-title{font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--card);border-radius:14px;padding:16px;text-align:center;border:var(--bd)}
.stat .icon{font-size:28px;margin-bottom:6px}
.stat .value{font-size:24px;font-weight:800;color:var(--pink-dark)}
.stat .label{font-size:11px;color:var(--text3);margin-top:2px}

/* Table */
table{width:100%;border-collapse:collapse}
th,td{padding:10px 12px;text-align:left;border-bottom:1.5px solid rgba(255,133,162,0.1);font-size:13px}
th{color:var(--text3);font-weight:600;font-size:11px;text-transform:uppercase}
tr:hover td{background:var(--pink-light)}

/* Buttons */
.btn{border:none;border-radius:16px;padding:8px 16px;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:5px}
.btn:active{transform:scale(0.95)}
.btn-primary{background:linear-gradient(135deg,var(--pink),var(--pink-dark));color:#fff;box-shadow:0 3px 10px rgba(255,133,162,0.3)}
.btn-secondary{background:var(--pink-light);color:var(--pink-dark);border:1.5px solid rgba(255,179,198,0.4)}
.btn-success{background:linear-gradient(135deg,var(--mint),var(--mint-dark));color:#fff}
.btn-danger{background:#fff0f0;color:#d14545;border:1.5px solid #fcc}
.btn-sm{padding:5px 10px;font-size:11px;border-radius:12px}
.btn-lg{padding:12px 24px;font-size:14px}
.btn-block{width:100%;justify-content:center}

/* Forms */
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:12px;font-weight:600;margin-bottom:5px;color:var(--text2)}
.input,.select,textarea{width:100%;border:1.5px solid rgba(0,0,0,0.08);border-radius:10px;padding:9px 12px;font-size:13px;background:#fff;outline:none;transition:all .2s;font-family:inherit}
.input:focus,.select:focus,textarea:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(255,133,162,0.08)}
textarea{min-height:80px;resize:vertical}

/* Tags */
.tag{display:inline-block;font-size:10px;padding:3px 8px;border-radius:12px;background:var(--pink-light);color:var(--pink-dark);font-weight:600}
.tag-green{background:#e8fbf3;color:var(--mint-dark)}
.tag-blue{background:#ecf5ff;color:#2b7cd3}
.tag-orange{background:#fff7f0;color:#d97706}

/* Todo */
.todo-item{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1.5px solid rgba(255,133,162,0.08)}
.todo-check{width:18px;height:18px;accent-color:var(--pink);cursor:pointer}
.todo-text{flex:1;font-size:13px}
.todo-text.done{text-decoration:line-through;color:var(--text3)}

/* Account card */
.acc-card{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:rgba(255,248,245,0.7);border:1.5px solid transparent;margin-bottom:8px;transition:all .15s}
.acc-card:hover{background:#fff;border-color:rgba(255,179,198,0.3)}
.acc-icon{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:20px;background:var(--pink-light)}
.acc-info{flex:1}
.acc-name{font-weight:700;font-size:13px}
.acc-meta{font-size:11px;color:var(--text3)}

/* Progress */
.progress{height:6px;background:#f0e8ec;border-radius:10px;overflow:hidden}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--pink2),var(--pink));border-radius:10px}

/* Sync */
.sync-box{background:linear-gradient(135deg,#fffef9,#fff5f7);border:2px solid rgba(255,179,198,0.3);border-radius:var(--radius);padding:24px;text-align:center;max-width:560px;margin:0 auto}
.sync-box h3{font-size:20px;color:var(--pink-dark);margin-bottom:8px}
.sync-box p{color:var(--text3);font-size:13px;margin-bottom:16px}
.sync-input{display:flex;gap:8px;margin-bottom:12px}
.sync-input input{flex:1}
.sync-actions{display:flex;gap:8px;justify-content:center;margin-top:16px}
.sync-status{margin-top:12px;font-size:12px;min-height:20px}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.3);display:none;align-items:center;justify-content:center;z-index:200}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:var(--radius);padding:24px;width:90%;max-width:460px;max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.15)}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.modal-title{font-size:16px;font-weight:700;color:var(--pink-dark)}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text3)}

/* Toast */
.toast-box{position:fixed;top:16px;right:16px;z-index:300}
.toast{background:#fff;border-radius:12px;padding:12px 16px;margin-bottom:8px;box-shadow:0 4px 20px rgba(0,0,0,0.12);display:flex;align-items:center;gap:8px;font-size:13px;animation:slideIn .3s;border-left:3px solid var(--pink)}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.toast-success{border-left-color:var(--mint-dark)}
.toast-error{border-left-color:#d14545}

/* Grid */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}

/* Toggle */
.toggle{position:relative;width:40px;height:22px;cursor:pointer;display:inline-block}
.toggle input{display:none}
.toggle .slider{position:absolute;inset:0;background:#ddd;border-radius:11px;transition:.3s}
.toggle .slider:before{content:'';position:absolute;width:18px;height:18px;left:2px;bottom:2px;background:#fff;border-radius:50%;transition:.3s}
.toggle input:checked+.slider{background:var(--pink)}
.toggle input:checked+.slider:before{transform:translateX(18px)}

@media(max-width:768px){
  .sidebar{display:none}
  .main{margin-left:0}
  .stats{grid-template-columns:1fr 1fr}
  .grid-2,.grid-3{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo"><h1>🎀 米粒大王</h1><p>工作台管理后台</p></div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-footer">♡ 管理后台 v1.0 ♡</div>
  </aside>
  <div class="main">
    <div class="topbar">
      <h2 id="pageTitle">📊 工作台</h2>
      <div style="display:flex;gap:8px;align-items:center">
        <span id="syncIndicator" style="font-size:12px;color:var(--text3)">⚪ 未同步</span>
        <button class="btn btn-success btn-sm" onclick="syncToGithub()">⬆️ 同步到GitHub</button>
        <button class="btn btn-secondary btn-sm" onclick="syncFromGithub()">⬇️ 从GitHub拉取</button>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="toast-box" id="toastBox"></div>
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modalTitle"></span>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<script>
const STORAGE = 'mb_v6';
const GITHUB_TOKEN_KEY = 'admin_github_token';
const GITHUB_REPO_KEY = 'admin_github_repo';

// 从原工作台加载数据
let state = loadState();
let githubToken = localStorage.getItem(GITHUB_TOKEN_KEY) || '';
let githubRepo = localStorage.getItem(GITHUB_REPO_KEY) || 'zeshanzhou98-coder/warm-heart-match-game';

function loadState() {
  try {
    const s = localStorage.getItem(STORAGE);
    if (s) { const p = JSON.parse(s); if (p && typeof p === 'object') return ensureDefaults(p); }
  } catch (e) {}
  return getDefaultState();
}

function saveState() {
  try { localStorage.setItem(STORAGE, JSON.stringify(state)); } catch (e) {}
}

function getDefaultState() {
  return {
    profile: { name: '米粒大王', avatar: null },
    accounts: [
      { id: 'a1', platform: '抖音', name: '米粒大王的日常', followers: 1280, active: true, growth: { day: 12, week: 86, month: 340, target: 5000 } },
      { id: 'a2', platform: '小红书', name: '米粒穿搭日记', followers: 3520, active: false, growth: { day: 45, week: 280, month: 1200, target: 10000 } },
      { id: 'a3', platform: 'B站', name: '米粒的剪辑间', followers: 860, active: false, growth: { day: 3, week: 22, month: 90, target: 2000 } }
    ],
    tasks: [
      { id: 't1', text: '发布一条穿搭短视频', completed: false, date: '2026-08-03' },
      { id: 't2', text: '英语单词+对话30min', completed: true, date: '2026-08-03' },
      { id: 't3', text: '肩颈拉伸8分钟', completed: false, date: '2026-08-03' }
    ],
    pinnedTasks: [
      { id: 'p1', text: '需找博主合作', completed: false },
      { id: 'p2', text: '拆解一篇爆款作品', completed: false },
      { id: 'p3', text: '更新拼豆账号', completed: false }
    ],
    reading: {
      reading: [{ id: 'r1', title: '原子习惯', author: 'James Clear', page: 86, totalPage: 288, added: '2026-07-20' }],
      want: [{ id: 'r2', title: '纳瓦尔宝典', author: 'Eric Jorgenson', page: 0, totalPage: 256, added: '2026-07-28' }],
      finished: [{ id: 'r3', title: '小狗钱钱', author: 'Bodo Schäfer', page: 208, totalPage: 208, added: '2026-06-15' }],
      recommend: [
        { title: '认知觉醒', author: '周岭', reason: '自媒体人必读' },
        { title: '影响力', author: 'Robert Cialdini', reason: '爆款内容的底层逻辑' },
        { title: '文案创作完全手册', author: 'Robert Bly', reason: '写出让人停不下来的标题' }
      ]
    },
    english: {
      words: [
        { id: 'w1', word: 'alter', meaning: '改变，改动', status: 'new' },
        { id: 'w2', word: 'burst', meaning: '突然发生，爆裂', status: 'new' },
        { id: 'w3', word: 'budget', meaning: '预算；做安排', status: 'review' },
        { id: 'w4', word: 'transform', meaning: '转变，变革', status: 'review' },
        { id: 'w5', word: 'tender', meaning: '温柔的；脆弱的', status: 'mastered' }
      ],
      dialogues: [
        { id: 'd1', title: '餐厅点餐', en: "A: May I take your order?\nB: Yes, I'd like a salad.", cn: '餐厅点餐场景' }
      ]
    },
    hits: [
      { title: '#2026秋日阔腿裤穿搭', heat: '12.7亿', tag: '穿搭', link: '' },
      { title: '#朱珠米兰街拍', heat: '12亿', tag: '穿搭', link: '' },
      { title: '#AI森系清透照', heat: '6800万', tag: 'AI', link: '' }
    ],
    exercises: [
      { title: '8min瘦双下巴拉伸', bvid: 'BV1Pa411f7PQ', dur: '08:17', up: 'HHOPEONE', done: false },
      { title: '瘦手臂+瘦背', bvid: 'BV1G9hHzyEPq', dur: '16:29', up: 'MIZI', done: false }
    ],
    wallet: {
      transactions: [
        { id: 'wx1', type: 'expense', amount: 35, category: '餐饮', method: '微信', note: '午餐', date: '2026-08-03' },
        { id: 'wx2', type: 'expense', amount: 8, category: '交通', method: '支付宝', note: '地铁', date: '2026-08-03' },
        { id: 'wx3', type: 'income', amount: 3000, category: '副业', method: '银行卡', note: '广告收入', date: '2026-08-01' }
      ]
    },
    review: {
      pending: [{ id: 'v1', title: '本周短视频数据复盘', date: '2026-08-03' }],
      done: []
    },
    editing: { activeTab: 'video', planProgress: {}, planNotes: {}, todayLearned: '', summary: '' },
    tools: { currentBg: 'assets/bg.jpg', custom: [], musicId: '', doll: '' },
    moods: {},
    sumikko: { clothes: [] },
    exerciseLog: {},
    exerciseStats: {},
    readingStats: {},
    inspirations: [],
    habits: {},
    comm: { progress: {}, notes: '', activeTab: 'daily', workProgress: {}, workNotes: '' }
  };
}

function ensureDefaults(p) {
  if (!p.moods) p.moods = {};
  if (!p.wallet) p.wallet = { transactions: [] };
  if (!p.profile) p.profile = { name: '米粒大王', avatar: null };
  if (!p.sumikko) p.sumikko = { clothes: [] };
  if (!p.pinnedTasks) p.pinnedTasks = getDefaultState().pinnedTasks;
  if (!p.exerciseLog) p.exerciseLog = {};
  if (!p.exerciseStats) p.exerciseStats = {};
  if (!p.readingStats) p.readingStats = {};
  if (!p.inspirations) p.inspirations = [];
  if (!p.habits) p.habits = {};
  if (!p.comm) p.comm = { progress: {}, notes: '', activeTab: 'daily', workProgress: {}, workNotes: '' };
  if (!p.editing) p.editing = { activeTab: 'video', planProgress: {}, planNotes: {}, todayLearned: '', summary: '' };
  if (!p.tools) p.tools = { currentBg: 'assets/bg.jpg', custom: [], musicId: '', doll: '' };
  return p;
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function esc(s) { if (s == null) return ''; return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function fmtNum(n) { const v = Number(n) || 0; return v >= 10000 ? (v / 10000).toFixed(1).replace(/\.0$/, '') + '万' : String(v); }
function fmtMoney(n) { return '¥' + (Number(n) || 0).toFixed(2); }
function today() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

// ========== GitHub 同步 ==========
function syncToGithub() {
  if (!githubToken) { showSyncConfig(); return; }
  document.getElementById('syncIndicator').innerHTML = '🟡 同步中...';
  
  const data = JSON.stringify(state, null, 2);
  const b64 = btoa(unescape(encodeURIComponent(data)));
  const url = `https://api.github.com/repos/${githubRepo}/contents/workspace-data.json`;

  fetch(url, { headers: { 'Authorization': '***' + githubToken } })
    .then(r => r.ok ? r.json() : null)
    .then(existing => {
      const body = { message: '🔄 Admin sync ' + new Date().toLocaleString('zh-CN'), content: b64, branch: 'main' };
      if (existing && existing.sha) body.sha = existing.sha;
      return fetch(url, { method: 'PUT', headers: { 'Authorization': '***' + githubToken, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    })
    .then(r => {
      if (r && r.ok) {
        document.getElementById('syncIndicator').innerHTML = '🟢 已同步';
        toast('同步成功！', 'success');
      } else {
        document.getElementById('syncIndicator').innerHTML = '🔴 同步失败';
        toast('同步失败', 'error');
      }
    })
    .catch(() => {
      document.getElementById('syncIndicator').innerHTML = '🔴 网络错误';
      toast('网络错误', 'error');
    });
}

function syncFromGithub() {
  if (!githubToken) { showSyncConfig(); return; }
  document.getElementById('syncIndicator').innerHTML = '🟡 拉取中...';

  fetch(`https://api.github.com/repos/${githubRepo}/contents/workspace-data.json`, {
    headers: { 'Authorization': '***' + githubToken }
  })
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(data => {
      const content = JSON.parse(decodeURIComponent(escape(atob(data.content))));
      state = ensureDefaults(content);
      saveState();
      document.getElementById('syncIndicator').innerHTML = '🟢 已同步';
      render('dashboard');
      toast('数据已从 GitHub 拉取', 'success');
    })
    .catch(() => {
      document.getElementById('syncIndicator').innerHTML = '🔴 拉取失败';
      toast('拉取失败', 'error');
    });
}

function showSyncConfig() {
  showModal('同步配置', `
    <div class="form-group"><label class="form-label">GitHub Token</label><input type="password" class="input" id="syncToken" placeholder="ghp_xxxx" value="${esc(githubToken)}"></div>
    <div class="form-group"><label class="form-label">仓库地址</label><input type="text" class="input" id="syncRepo" placeholder="username/repo" value="${esc(githubRepo)}"></div>
    <button class="btn btn-primary btn-block" onclick="saveSyncConfig()">💾 保存配置</button>
    <div style="font-size:11px;color:var(--text3);margin-top:8px;text-align:center">保存后即可使用同步功能</div>
  `);
}

function saveSyncConfig() {
  githubToken = document.getElementById('syncToken').value;
  githubRepo = document.getElementById('syncRepo').value;
  localStorage.setItem(GITHUB_TOKEN_KEY, githubToken);
  localStorage.setItem(GITHUB_REPO_KEY, githubRepo);
  closeModal();
  toast('同步配置已保存', 'success');
}

// ========== 导航 ==========
const pages = [
  { id: 'dashboard', icon: '📊', label: '工作台' },
  { id: 'sync', icon: '🔄', label: '同步配置' },
  { id: 'accounts', icon: '📱', label: '账号管理' },
  { id: 'tasks', icon: '📋', label: '任务规划' },
  { id: 'pinned', icon: '📌', label: '置顶任务' },
  { id: 'reading', icon: '📖', label: '阅读管理' },
  { id: 'english', icon: '📚', label: '英语学习' },
  { id: 'hits', icon: '🔥', label: '热点追踪' },
  { id: 'exercise', icon: '💪', label: '锻炼计划' },
  { id: 'wallet', icon: '💰', label: '钱包记账' },
  { id: 'review', icon: '📝', label: '复盘总结' },
  { id: 'editing', icon: '🎬', label: '剪辑教程' },
  { id: 'moods', icon: '💝', label: '心情日记' },
  { id: 'tools', icon: '🛠️', label: '工具箱' }
];

function initNav() {
  document.getElementById('nav').innerHTML = pages.map(p =>
    `<div class="nav-item${p.id === 'dashboard' ? ' active' : ''}" data-page="${p.id}" onclick="go('${p.id}')"><span>${p.icon}</span><span>${p.label}</span></div>`
  ).join('');
}

function go(id) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.page === id));
  const p = pages.find(p => p.id === id);
  document.getElementById('pageTitle').textContent = p.icon + ' ' + p.label;
  render(id);
}

// ========== 渲染 ==========
function render(id) {
  const el = document.getElementById('content');
  const r = { dashboard: renderDashboard, sync: renderSync, accounts: renderAccounts, tasks: renderTasks, pinned: renderPinned, reading: renderReading, english: renderEnglish, hits: renderHits, exercise: renderExercise, wallet: renderWallet, review: renderReview, editing: renderEditing, moods: renderMoods, tools: renderTools };
  el.innerHTML = (r[id] || renderDashboard)();

// ========== 操作 ==========
function toggleTask(id) { const t = state.tasks.find(t => t.id === id); if (t) { t.completed = !t.completed; save(); render('tasks'); } }
function togglePinned(id) { const t = state.pinnedTasks.find(t => t.id === id); if (t) { t.completed = !t.completed; save(); render('pinned'); } }
function deleteItem(arr, id) { if (arr.includes('.')) { const [a, b] = arr.split('.'); state[a][b] = state[a][b].filter(i => i.id !== id); } else { state[arr] = state[arr].filter(i => i.id !== id); } save(); render(pages.find(p => p.active)?.id || 'dashboard'); toast('已删除'); }
function deleteItemNested(parent, child, id) { state[parent][child] = state[parent][child].filter(i => i.id !== id); save(); render('reading'); toast('已删除'); }
function cycleWord(id) { const w = state.english.words.find(w => w.id === id); if (w) { w.status = { new: 'review', review: 'mastered', mastered: 'new' }[w.status]; save(); render('english'); } }
function deleteWord(id) { state.english.words = state.english.words.filter(w => w.id !== id); save(); render('english'); toast('已删除'); }

function showAddExercise() {
  showModal('添加锻炼', `
    <div class="form-group"><label class="form-label">名称</label><input type="text" class="input" id="mTitle"></div>
    <div class="form-group"><label class="form-label">时长</label><input type="text" class="input" id="mDur" placeholder="08:17"></div>
    <div class="form-group"><label class="form-label">BV号</label><input type="text" class="input" id="mBvid" placeholder="BV1xxx"></div>
    <div class="form-group"><label class="form-label">UP主</label><input type="text" class="input" id="mUp"></div>
    <button class="btn btn-primary btn-block" onclick="addExercise()">添加</button>`);
}
function addExercise() {
  const title = document.getElementById('mTitle').value; if (!title) { toast('请输入名称', 'error'); return; }
  state.exercises.push({ title, dur: document.getElementById('mDur').value, bvid: document.getElementById('mBvid').value, up: document.getElementById('mUp').value, done: false });
  save(); closeModal(); render('exercise'); toast('已添加', 'success');
}

function showAddTransaction() {
  showModal('记一笔', `
    <div class="form-group"><label class="form-label">类型</label><select class="select" id="mType"><option value="expense">支出</option><option value="income">收入</option></select></div>
    <div class="form-group"><label class="form-label">分类</label><select class="select" id="mCat"><option>餐饮</option><option>交通</option><option>购物</option><option>娱乐</option><option>居住</option><option>服饰</option><option>咖啡</option><option>副业</option><option>红包</option><option>其他</option></select></div>
    <div class="form-group"><label class="form-label">金额</label><input type="number" class="input" id="mAmount"></div>
    <div class="form-group"><label class="form-label">说明</label><input type="text" class="input" id="mNote"></div>
    <div class="form-group"><label class="form-label">方式</label><select class="select" id="mMethod"><option>微信</option><option>支付宝</option><option>银行卡</option></select></div>
    <button class="btn btn-primary btn-block" onclick="addTransaction()">记录</button>`);
}
function addTransaction() {
  const amount = Number(document.getElementById('mAmount').value); if (!amount) { toast('请输入金额', 'error'); return; }
  state.wallet.transactions.unshift({ id: uid(), type: document.getElementById('mType').value, amount, category: document.getElementById('mCat').value, method: document.getElementById('mMethod').value, note: document.getElementById('mNote').value, date: today() });
  save(); closeModal(); render('wallet'); toast('已记录', 'success');
}

function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'workspace-data.json'; a.click();
  toast('已导出', 'success');
}

function importData() {
  const input = document.createElement('input'); input.type = 'file'; input.accept = '.json';
  input.onchange = e => {
    const reader = new FileReader();
    reader.onload = ev => { try { state = ensureDefaults(JSON.parse(ev.target.result)); save(); render('dashboard'); toast('已导入', 'success'); } catch (err) { toast('文件格式错误', 'error'); } };
    reader.readAsText(e.target.files[0]);
  };
  input.click();
}

function toast(msg, type = 'info') {
  const box = document.getElementById('toastBox');
  const t = document.createElement('div'); t.className = 'toast toast-' + type;
  t.innerHTML = `<span>${type === 'success' ? '✅' : type === 'error' ? '❌' : 'ℹ️'}</span><span>${msg}</span>`;
  box.appendChild(t); setTimeout(() => t.remove(), 3000);
}

// ========== 初始化 ==========
initNav();
render('dashboard');
</script>
</body>
</html>
