<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>米粒大王的工作台 · 管理后台</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap');
:root{--pink:#ff85a2;--pink2:#ffb3c6;--pink-light:#fff0f3;--pink-dark:#e84d7a;--mint:#a8e6cf;--mint-light:#e8fbf3;--mint-dark:#56c596;--lavender:#c3aed6;--lav-light:#f3eef9;--peach:#ffd3b6;--peach-light:#fff7f0;--sky:#b5d8ff;--sky-light:#ecf5ff;--text:#4a3728;--text2:#8b7355;--text3:#b8a088;--card:rgba(255,255,255,0.97);--shadow:0 4px 16px rgba(255,133,162,0.12);--shadow-lg:0 8px 32px rgba(255,133,162,0.16);--radius:16px;--radius-sm:10px;--bd:2px solid rgba(255,133,162,0.18);--sidebar-w:220px;--font-cute:'ZCOOL KuaiLe','PingFang SC',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;color:var(--text);background:#fff5f7;min-height:100vh}
/* SIDEBAR */
.sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar-w);background:linear-gradient(180deg,#fffef9,#fff5f7);border-right:var(--bd);display:flex;flex-direction:column;z-index:100;overflow-y:auto}
.sidebar-logo{padding:20px 16px 16px;text-align:center;border-bottom:2px solid rgba(255,133,162,0.12)}
.sidebar-logo h2{font-family:var(--font-cute);color:var(--pink-dark);font-size:18px;letter-spacing:1px}
.sidebar-logo small{color:var(--text3);font-size:11px}
.nav-list{flex:1;padding:10px 8px;display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;transition:all .15s;color:var(--text2);font-weight:600;font-size:13px;border:1.5px solid transparent}
.nav-item:hover{background:var(--pink-light);color:var(--pink-dark);border-color:rgba(255,179,198,0.3)}
.nav-item.active{background:linear-gradient(135deg,var(--pink),var(--pink-dark));color:#fff;box-shadow:0 4px 14px rgba(255,133,162,0.4)}
.nav-icon{font-size:16px;width:24px;text-align:center}
.sidebar-footer{padding:12px;text-align:center;font-size:10px;color:var(--pink2);border-top:2px solid rgba(255,133,162,0.12)}
/* MAIN */
.main{margin-left:var(--sidebar-w);min-height:100vh}
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,245,247,0.92);backdrop-filter:blur(12px);border-bottom:var(--bd);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.topbar-title{font-family:var(--font-cute);font-size:20px;color:var(--pink-dark);letter-spacing:1px}
.topbar-actions{display:flex;gap:8px;align-items:center}
.content{padding:24px;max-width:1000px}
/* BUTTONS */
.btn{border:none;border-radius:20px;padding:8px 16px;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:4px;font-family:inherit;letter-spacing:.5px;white-space:nowrap}
.btn:active{transform:scale(0.95)}
.btn-primary{background:linear-gradient(135deg,var(--pink),var(--pink-dark));color:#fff;box-shadow:0 4px 12px rgba(255,133,162,0.3)}
.btn-primary:hover{box-shadow:0 6px 18px rgba(255,133,162,0.4)}
.btn-secondary{background:var(--pink-light);color:var(--pink-dark);border:1.5px solid rgba(255,179,198,0.4)}
.btn-secondary:hover{background:#ffe4ee}
.btn-danger{background:#fff0f0;color:#d14545;border:1.5px solid #fcc}
.btn-sm{padding:5px 10px;font-size:11px;border-radius:14px}
.btn-mint{background:var(--mint-light);color:var(--mint-dark);border:1.5px solid var(--mint)}
/* FORMS */
.input,.select,textarea{width:100%;border:1.5px solid rgba(0,0,0,0.08);border-radius:8px;padding:8px 12px;font-size:13px;background:#fff;outline:none;transition:all .15s;font-family:inherit;color:var(--text)}
.input:focus,.select:focus,textarea:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(255,133,162,0.08)}
textarea{resize:vertical;min-height:60px}
label{font-size:12px;font-weight:700;color:var(--text2);margin-bottom:4px;display:block}
.form-group{margin-bottom:12px}
.form-row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.form-row .form-group{flex:1;min-width:120px}
/* CARDS */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;border:var(--bd);margin-bottom:16px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.card-title{font-size:15px;font-weight:700;font-family:var(--font-cute);letter-spacing:1px;color:var(--pink-dark);display:flex;align-items:center;gap:6px}
/* TABLE */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:8px 10px;text-align:left;border-bottom:1.5px solid rgba(255,179,198,0.15);vertical-align:middle}
th{font-weight:700;color:var(--pink-dark);font-size:11px;background:rgba(255,248,245,0.5);position:sticky;top:0}
tr:hover{background:rgba(255,240,243,0.3)}
/* TAGS */
.tag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:12px;background:var(--pink-light);color:var(--pink-dark);font-weight:700}
.tag-green{background:var(--mint-light);color:var(--mint-dark)}
.tag-blue{background:var(--sky-light);color:#2b7cd3}
/* TOAST */
.toast-container{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{padding:10px 16px;border-radius:10px;font-size:12px;font-weight:600;box-shadow:var(--shadow-lg);animation:slideIn .3s ease;max-width:300px}
.toast-success{background:var(--mint-light);color:var(--mint-dark);border:1.5px solid var(--mint)}
.toast-error{background:#fff0f0;color:#d14545;border:1.5px solid #fcc}
.toast-info{background:var(--sky-light);color:#2b7cd3;border:1.5px solid var(--sky)}
@keyframes slideIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.3);z-index:200;display:none;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:24px;width:min(500px,90vw);max-height:80vh;overflow-y:auto;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:scale(0.95)}to{opacity:1;transform:scale(1)}}
.modal-title{font-family:var(--font-cute);font-size:18px;color:var(--pink-dark);margin-bottom:16px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
/* SECTION */
.section{display:none}
.section.active{display:block}
.section-title{font-family:var(--font-cute);font-size:22px;color:var(--pink-dark);margin-bottom:16px;letter-spacing:1px}
/* SYNC STATUS */
.sync-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:12px}
.sync-ok{background:var(--mint-light);color:var(--mint-dark)}
.sync-err{background:#fff0f0;color:#d14545}
.sync-syncing{background:var(--sky-light);color:#2b7cd3}
/* EMPTY */
.empty{text-align:center;color:var(--text3);font-size:12px;padding:20px}
/* SETTINGS */
.settings-card{background:linear-gradient(135deg,var(--lav-light),#fff);border-color:rgba(195,174,214,0.4)}
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:16px}
.stat-box{background:var(--card);border-radius:var(--radius-sm);padding:12px;text-align:center;border:var(--bd)}
.stat-num{font-size:24px;font-weight:800;font-family:var(--font-cute);color:var(--pink-dark)}
.stat-label{font-size:10px;color:var(--text3);margin-top:2px}
@media(max-width:768px){.sidebar{display:none}.main{margin-left:0}.content{padding:12px}}
</style>
</head>
<body>
<div class="sidebar">
  <div class="sidebar-logo"><h2>🌸 管理后台</h2><small>米粒大王的工作台</small></div>
  <nav class="nav-list" id="navList">
    <div class="nav-item active" data-section="dashboard"><span class="nav-icon">📊</span>总览</div>
    <div class="nav-item" data-section="accounts"><span class="nav-icon">📱</span>账号管理</div>

    <div class="nav-item" data-section="english"><span class="nav-icon">🇬🇧</span>英语管理</div>
    <div class="nav-item" data-section="hits"><span class="nav-icon">🔥</span>热点管理</div>

<script>
'use strict';
// ═══════════════════════════════════════
// CONFIG & STATE
// ═══════════════════════════════════════
var CONFIG_KEY='mili_admin_config';
var DATA_KEY='mb_v6';
var cfg=loadConfig();
var state=null;
var fileSha=null;

function loadConfig(){
  try{var c=localStorage.getItem(CONFIG_KEY);if(c)return JSON.parse(c);}catch(e){}
  return {token:'',owner:'zeshanzhou98-coder',repo:'warm-heart-match-game',path:'data.json'};
}
function saveConfig(){localStorage.setItem(CONFIG_KEY,JSON.stringify(cfg));}

// ═══════════════════════════════════════
// GITHUB API
// ═══════════════════════════════════════
function apiUrl(path){return 'https://api.github.com/repos/'+cfg.owner+'/'+cfg.repo+'/'+path;}
function authHeaders(){
  var h={'Accept':'application/vnd.github.v3+json'};
  if(cfg.token)h['Authorization']='token '+cfg.token;
  return h;
}

async function githubRead(){
  if(!cfg.token||!cfg.owner||!cfg.repo)throw new Error('请先配置同步设置');
  var url=apiUrl('contents/'+cfg.path);
  var r=await fetch(url,{headers:authHeaders()});
  if(r.status===404)return{data:null,sha:null};
  if(!r.ok)throw new Error('读取失败: '+r.status+' '+(await r.text()));
  var j=await r.json();
  fileSha=j.sha;
  var content=atob(j.content);
  return{data:JSON.parse(content),sha:j.sha};
}

async function githubWrite(data,message){
  if(!cfg.token)throw new Error('请先配置同步设置');
  var url=apiUrl('contents/'+cfg.path);
  var body={message:message||'update data',content:btoa(unescape(encodeURIComponent(JSON.stringify(data,null,2))))};
  if(fileSha)body.sha=fileSha;
  var r=await fetch(url,{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},authHeaders()),body:JSON.stringify(body)});
  if(!r.ok){
    var err=await r.json();
    if(err.message&&err.message.indexOf('sha')>=0){
      toast('冲突：文件已被修改，请先拉取最新数据','error');
      throw new Error('SHA conflict');
    }
    throw new Error('写入失败: '+r.status);
  }
  var j=await r.json();
  fileSha=j.content.sha;
  return j;
}

// ═══════════════════════════════════════
// STATE MANAGEMENT
// ═══════════════════════════════════════
function defaultState(){
  return{
    profile:{name:'米粒大王',avatar:null},
    accounts:[
      {id:'a1',platform:'抖音',name:'米粒大王的日常',followers:1280,active:true,growth:{day:12,week:86,month:340,target:5000}},
      {id:'a2',platform:'小红书',name:'米粒穿搭日记',followers:3520,active:false,growth:{day:45,week:280,month:1200,target:10000}},
      {id:'a3',platform:'B站',name:'米粒的剪辑间',followers:860,active:false,growth:{day:3,week:22,month:90,target:2000}}
    ],
    tasks:[
      {id:'t1',text:'发布一条穿搭短视频',completed:false,date:'2026-08-02'},
      {id:'t2',text:'英语单词+对话30min',completed:true,date:'2026-08-02'},
      {id:'t3',text:'肩颈拉伸8分钟',completed:false,date:'2026-08-02'}
    ],
    pinnedTasks:[
      {id:'p1',text:'需找博主合作',completed:false},
      {id:'p2',text:'拆解一篇小红书/抖音爆款作品',completed:false},
      {id:'p3',text:'更新拼豆账号',completed:false}
    ],
    reading:{reading:[],want:[],finished:[],recommend:[]},
    english:{words:[],dialogues:[]},
    hits:[],
    exercises:[],
    exerciseLog:{},
    exerciseStats:{},
    readingStats:{},
    inspirations:[],
    habits:{},
    editing:{activeTab:'video',planProgress:{},planNotes:{},todayLearned:'',summary:''},
    wallet:{transactions:[]},
    review:{pending:[],done:[]},
    tools:{currentBg:'assets/bg.jpg',custom:[],musicId:'',doll:''},
    comm:{progress:{},notes:'',activeTab:'daily',workProgress:{},workNotes:''},
    moods:{},
    sumikko:{clothes:[]}
  };
}

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function esc(s){if(s==null)return'';return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmtNum(n){var num=Number(n)||0;if(num>=10000)return(num/10000).toFixed(1)+'万';return String(num).replace(/\B(?=(\d{3})+(?!\d))/g,',');}
function fmtMoney(n){return(Number(n)||0).toFixed(2);}

// ═══════════════════════════════════════
// SYNC
// ═══════════════════════════════════════
async function pullFromGitHub(){
  var badge=document.getElementById('syncBadge');
  badge.className='sync-badge sync-syncing';badge.textContent='⏳ 拉取中...';
  try{
    var result=await githubRead();
    if(result.data){
      state=result.data;
      localStorage.setItem(DATA_KEY,JSON.stringify(state));
      toast('✅ 已从云端拉取最新数据','success');
      renderCurrentSection();
    }else{
      toast('云端暂无数据，将推送当前数据','info');
    }
  }catch(e){
    badge.className='sync-badge sync-err';badge.textContent='❌ 连接失败';
    toast('拉取失败: '+e.message,'error');
    return;
  }
  badge.className='sync-badge sync-ok';badge.textContent='✅ 已连接';
}

async function pushToGitHub(){
  if(!state){toast('没有数据可推送','error');return;}
  var badge=document.getElementById('syncBadge');
  badge.className='sync-badge sync-syncing';badge.textContent='⏳ 推送中...';
  try{
    await githubWrite(state,'admin: update workspace data');
    localStorage.setItem(DATA_KEY,JSON.stringify(state));
    toast('✅ 已推送到云端','success');
  }catch(e){
    badge.className='sync-badge sync-err';badge.textContent='❌ 推送失败';
    toast('推送失败: '+e.message,'error');
    return;
  }
  badge.className='sync-badge sync-ok';badge.textContent='✅ 已连接';
}

async function autoSync(){
  if(!cfg.token)return;
  try{
    var result=await githubRead();
    if(result.data){
      state=result.data;
      localStorage.setItem(DATA_KEY,JSON.stringify(state));
    }
  }catch(e){
    // fallback to localStorage
  }
}

// ═══════════════════════════════════════
// TOAST
// ═══════════════════════════════════════
function toast(msg,type){
  var c=document.getElementById('toasts');
  var d=document.createElement('div');
  d.className='toast toast-'+(type||'info');
  d.textContent=msg;
  c.appendChild(d);
  setTimeout(function(){if(d.parentNode)d.remove();},3500);
}

// ═══════════════════════════════════════
// MODAL
// ═══════════════════════════════════════
function showModal(title,content,actions){
  var m=document.getElementById('modal');
  m.innerHTML='<div class="modal-title">'+title+'</div>'+content+'<div class="modal-actions">'+(actions||'')+'</div>';
  document.getElementById('modalOverlay').classList.add('show');
}
function closeModal(){document.getElementById('modalOverlay').classList.remove('show');}
document.getElementById('modalOverlay').onclick=function(e){if(e.target===this)closeModal();};

// ═══════════════════════════════════════
// SAVE STATE
// ═══════════════════════════════════════
function saveLocal(){localStorage.setItem(DATA_KEY,JSON.stringify(state));}

// ═══════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════
var currentSection='dashboard';
var sectionTitles={dashboard:'📊 总览',accounts:'📱 账号管理',tasks:'📝 任务管理',reading:'📖 阅读管理',english:'🇬🇧 英语管理',hits:'🔥 热点管理',exercise:'💪 锻炼管理',wallet:'💰 记账管理',habits:'🌱 习惯管理',profile:'👤 个人资料',data:'📦 数据管理',settings:'⚙️ 同步设置'};
var sectionRenderers={dashboard:renderDashboard,accounts:renderAccounts,tasks:renderTasks,reading:renderReading,english:renderEnglish,hits:renderHits,exercise:renderExercise,wallet:renderWallet,habits:renderHabits,profile:renderProfile,data:renderData,settings:renderSettings};

function switchSection(id){
  currentSection=id;
  var items=document.querySelectorAll('.nav-item');
  for(var i=0;i<items.length;i++){
    items[i].classList.toggle('active',items[i].dataset.section===id);
  }
  document.getElementById('topTitle').textContent=sectionTitles[id]||id;
  renderCurrentSection();
}
function renderCurrentSection(){
  var fn=sectionRenderers[currentSection];
  document.getElementById('content').innerHTML=fn?fn():'<div class="empty">页面不存在</div>';
  var bindFn=window['bind_'+currentSection];
  if(bindFn)bindFn();
}

// ═══════════════════════════════════════
// SECTION: DASHBOARD
// ═══════════════════════════════════════
function renderDashboard(){
  var accts=state.accounts||[];
  var tasks=state.tasks||[];
  var doneTasks=0;for(var i=0;i<tasks.length;i++)if(tasks[i].completed)doneTasks++;
  var words=(state.english&&state.english.words)?state.english.words.length:0;
  var txns=(state.wallet&&state.wallet.transactions)?state.wallet.transactions.length:0;
  var h='<div class="section-title">📊 工作台总览</div>';
  h+='<div class="stats-row">';
  h+='<div class="stat-box"><div class="stat-num">'+accts.length+'</div><div class="stat-label">自媒体账号</div></div>';
  h+='<div class="stat-box"><div class="stat-num">'+tasks.length+'</div><div class="stat-label">今日任务</div></div>';
  h+='<div class="stat-box"><div class="stat-num">'+doneTasks+'</div><div class="stat-label">已完成</div></div>';
  h+='<div class="stat-box"><div class="stat-num">'+words+'</div><div class="stat-label">英语单词</div></div>';
  h+='<div class="stat-box"><div class="stat-num">'+txns+'</div><div class="stat-label">记账笔数</div></div>';
  h+='</div>';
  h+='<div class="card"><div class="card-header"><span class="card-title">💡 快捷操作</span></div>';
  h+='<div style="display:flex;gap:8px;flex-wrap:wrap">';
  h+='<button class="btn btn-primary" onclick="switchSection(\'accounts\')">📱 管理账号</button>';
  h+='<button class="btn btn-primary" onclick="switchSection(\'tasks\')">📝 管理任务</button>';
  h+='<button class="btn btn-secondary" onclick="switchSection(\'reading\')">📖 管理阅读</button>';
  h+='<button class="btn btn-secondary" onclick="switchSection(\'english\')">🇬🇧 管理英语</button>';
  h+='<button class="btn btn-secondary" onclick="switchSection(\'wallet\')">💰 管理记账</button>';
  h+='<button class="btn btn-mint" onclick="pushToGitHub()">⬆️ 一键同步</button>';
  h+='</div></div>';

function bind_wallet(){
  document.getElementById('addTxnBtn').onclick=function(){
    var type=document.getElementById('txnType').value,amount=Number(document.getElementById('txnAmount').value)||0,category=document.getElementById('txnCategory').value.trim(),method=document.getElementById('txnMethod').value,note=document.getElementById('txnNote').value.trim(),date=document.getElementById('txnDate').value;

    if(!state.wallet)state.wallet={transactions:[]};
    state.wallet.transactions.push({id:uid(),type:type,amount:amount,category:category,method:method,note:note,date:date});
    saveLocal();toast('✅ 已记账','success');renderCurrentSection();

  for(var i=0;i<dels.length;i++){dels[i].onclick=function(){var id=this.dataset.id;
    state.wallet.transactions=state.wallet.transactions.filter(function(t){return t.id!==id;});
    saveLocal();toast('已删除','success');renderCurrentSection();
  };}
}

function renderHabits(){
  var habits=state.habits||{};
  var cats=[{key:'water',name:'喝水',icon:'💧'},{key:'exercise',name:'运动',icon:'🏃'},{key:'hair',name:'增发',icon:'💆'},{key:'sleep',name:'早睡',icon:'😴'}];
  var h='<div class="section-title">🌱 习惯管理</div>';
  var today=new Date();var todayStr=today.toISOString().slice(0,10);
  for(var c=0;c<cats.length;c++){var cat=cats[c];var data=habits[cat.key]||{};
    h+='<div class="card"><div class="card-header"><span class="card-title">'+cat.icon+' '+cat.name+'</span></div>';
    h+='<div class="form-row"><div class="form-group"><label>今日打卡</label><button class="btn '+(data[todayStr]?'btn-mint':'btn-secondary')+'" data-habit="'+cat.key+'" data-date="'+todayStr+'" id="habit-'+cat.key+'">'+(data[todayStr]?'✅ 已打卡':'打卡')+'</button></div>';
    h+='<div class="form-group"><label>指定日期打卡</label><input class="input" type="date" id="habitDate-'+cat.key+'" value="'+todayStr+'"></div>';
    h+='<div class="form-group"><label>&nbsp;</label><button class="btn btn-primary habit-toggle" data-habit="'+cat.key+'">切换打卡</button></div></div>';
    var count=0;for(var k in data)if(data[k])count++;
    h+='<div style="font-size:11px;color:var(--text3);margin-top:6px">累计打卡: '+count+' 天</div></div>';
  }
  return h;
}
function bind_habits(){
  var btns=document.querySelectorAll('.habit-toggle');
  for(var i=0;i<btns.length;i++){btns[i].onclick=function(){var key=this.dataset.habit;
    var dateInput=document.getElementById('habitDate-'+key);var dt=dateInput.value;
    if(!state.habits)state.habits={};if(!state.habits[key])state.habits[key]={};
    if(state.habits[key][dt]){delete state.habits[key][dt];toast('已取消打卡','info');}
    else{state.habits[key][dt]=true;toast('✅ 已打卡','success');}
    saveLocal();renderCurrentSection();
  };}
  var todayBtns=document.querySelectorAll('[data-habit][data-date]');
  for(var j=0;j<todayBtns.length;j++){todayBtns[j].onclick=function(){var key=this.dataset.habit,dt=this.dataset.date;
    if(!state.habits)state.habits={};if(!state.habits[key])state.habits[key]={};
    if(state.habits[key][dt]){delete state.habits[key][dt];toast('已取消打卡','info');}
    else{state.habits[key][dt]=true;toast('✅ 已打卡','success');}
    saveLocal();renderCurrentSection();
  };}
}

function renderData(){
  var h='<div class="section-title">📦 数据管理</div>';

  h+='<div style="display:flex;gap:8px;flex-wrap:wrap">';
  h+='<button class="btn btn-primary" id="exportBtn">📤 导出JSON</button>';
  h+='<button class="btn btn-secondary" id="importBtn">📥 导入JSON</button>';

  h+='</div><div style="font-size:11px;color:var(--text3);margin-top:8px">导出数据可备份到本地，导入可恢复数据</div></div>';
  h+='<div class="card"><div class="card-header"><span class="card-title">⚠️ 危险操作</span></div>';
  h+='<button class="btn btn-danger" id="resetBtn">🔄 重置所有数据</button>';

function bind_data(){
  document.getElementById('exportBtn').onclick=function(){
    var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mili_data_'+new Date().toISOString().slice(0,10)+'.json';a.click();
    toast('✅ 已导出','success');
  };
  document.getElementById('importBtn').onclick=function(){document.getElementById('importFile').click();};
  document.getElementById('importFile').onchange=function(){
    var f=this.files[0];if(!f)return;var r=new FileReader();
    r.onload=function(ev){try{var d=JSON.parse(ev.target.result);if(d&&typeof d==='object'){state=d;saveLocal();toast('✅ 已导入','success');renderCurrentSection();}}catch(e){toast('导入失败: 文件格式错误','error');}};
    r.readAsText(f);
  };
  document.getElementById('resetBtn').onclick=function(){
    if(!confirm('确定要重置所有数据吗？此操作不可撤销！'))return;
    state=defaultState();saveLocal();toast('已重置','info');renderCurrentSection();
  };
}

  h+='<div class="form-group"><label>仓库名</label><input class="input" id="cfgRepo" value="'+esc(cfg.repo)+'"></div>';
  h+='<div class="form-group"><label>数据文件名</label><input class="input" id="cfgPath" value="'+esc(cfg.path)+'"></div></div>';

  h+='<div class="card"><div class="card-header"><span class="card-title">📖 使用说明</span></div>';
  h+='<div style="font-size:12px;color:var(--text2);line-height:1.8">';
  h+='<b>1. 创建 GitHub Token：</b><br>打开 <a href="https://github.com/settings/tokens?type=beta" target="_blank">GitHub Token 设置</a>，生成新 Token，勾选 <code>repo</code> 权限。<br><br>';
  h+='<b>2. 配置仓库信息：</b><br>填写你的 GitHub 用户名和仓库名，数据将保存为仓库中的 JSON 文件。<br><br>';
  h+='<b>3. 同步流程：</b><br>• <b>推送</b>：将本地数据上传到 GitHub<br>• <b>拉取</b>：从 GitHub 下载最新数据到本地<br>• 工作台打开时会自动尝试从云端加载数据<br><br>';
  h+='<b>4. 注意事项：</b><br>• Token 请妥善保管，不要泄露给他人<br>• 推送前建议先拉取最新数据，避免冲突<br>• 数据文件默认为 <code>data.json</code>';
  h+='</div></div>';
  return h;

function bind_settings(){
  document.getElementById('saveCfgBtn').onclick=function(){
    cfg.token=document.getElementById('cfgToken').value.trim();
    cfg.owner=document.getElementById('cfgOwner').value.trim();
    cfg.repo=document.getElementById('cfgRepo').value.trim();
    cfg.path=document.getElementById('cfgPath').value.trim()||'data.json';
    saveConfig();toast('✅ 配置已保存','success');
    var badge=document.getElementById('syncBadge');
    badge.className='sync-badge sync-ok';badge.textContent='✅ 已配置';
  };
  document.getElementById('testCfgBtn').onclick=async function(){
    this.textContent='测试中...';this.disabled=true;
    try{
      cfg.token=document.getElementById('cfgToken').value.trim();
      cfg.owner=document.getElementById('cfgOwner').value.trim();
      cfg.repo=document.getElementById('cfgRepo').value.trim();
      cfg.path=document.getElementById('cfgPath').value.trim()||'data.json';
      var result=await githubRead();
      toast('✅ 连接成功！'+(result.data?'已找到数据文件':'云端暂无数据'),'success');
    }catch(e){
      toast('连接失败: '+e.message,'error');
    }
    this.textContent='🔍 测试连接';this.disabled=false;
  };
}

// ═══════════════════════════════════════
// INIT
// ═══════════════════════════════════════
async function init(){
  // Load state
  try{var saved=localStorage.getItem(DATA_KEY);if(saved)state=JSON.parse(saved);}catch(e){}
  if(!state)state=defaultState();

  // Nav click handlers
  var items=document.querySelectorAll('.nav-item');
  for(var i=0;i<items.length;i++){items[i].onclick=function(){switchSection(this.dataset.section);};}

  // Auto sync if token exists
  if(cfg.token){
    var badge=document.getElementById('syncBadge');
    badge.className='sync-badge sync-syncing';badge.textContent='⏳ 同步中...';
    try{
      var result=await githubRead();
      if(result.data){
        state=result.data;
        localStorage.setItem(DATA_KEY,JSON.stringify(state));
        badge.className='sync-badge sync-ok';badge.textContent='✅ 已同步';
      }
    }catch(e){
      badge.className='sync-badge sync-err';badge.textContent='⚠️ 离线模式';
    }
  }

  // Render
  renderCurrentSection();
}

init();
</script>
